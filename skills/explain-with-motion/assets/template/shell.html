<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width={{W}}, height={{H}}" />
<!-- generated by scripts/build.py from src/ + project.json + brand.json — edit those, not this file -->
<script src="assets/vendor/gsap.min.js"></script>
<style>
{{FONTFACES}}
:root{
{{BRANDVARS}}
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{margin:0;width:{{W}}px;height:{{H}}px;overflow:hidden;background:{{PAPER}};font-family:"{{TEXT}}",sans-serif}
#root{width:100%;height:100%;position:relative;overflow:hidden;background:var(--paper);color:var(--ink);font-family:"{{TEXT}}",sans-serif}
.abs{position:absolute}
.boil{filter:url(#boilF)}
.fig{display:block;overflow:visible}

#vwrap{position:absolute;overflow:hidden;background:#11304c}
#clipvideo{width:100%;height:100%;object-fit:cover;display:block}
#capstrip{position:absolute;background:var(--paper2);border-bottom:2px solid var(--primary-light)}
.cap{position:absolute;inset:0 40px;display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:"{{TEXT}}";font-weight:500;line-height:1.25;color:var(--ink);opacity:0}
.cap b{font-weight:600;color:var(--primary-dark)}
#lt{position:absolute;padding:14px 24px 16px;border-radius:16px;background:var(--paper);box-shadow:0 10px 30px rgba(12,35,53,.25)}
#lt .n{font-weight:600;font-size:27px;color:var(--ink)}
#lt .r{font-weight:400;font-size:21px;color:var(--muted);margin-top:2px}
#lt .bar{position:absolute;left:24px;top:0;width:56px;height:5px;border-radius:0 0 3px 3px;background:var(--accent)}
#panelbg{position:absolute;overflow:hidden;background:var(--paper)}
.ring{position:absolute;border-radius:50%;border:3px dashed var(--primary-light)}
#grain{position:absolute;inset:0;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
#foot{position:absolute}
#foot .line{position:absolute;left:60px;right:60px;top:0;height:2px;background:var(--primary-light)}
#foot .l{position:absolute;left:60px;top:18px;font-size:20px;color:var(--muted)}
#foot .rr{position:absolute;right:60px;top:13px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:20px;color:var(--primary-dark)}
#foot img{height:30px;width:auto;display:block}

.scene{position:absolute;overflow:hidden}
.sc{position:absolute;inset:0}
.h{position:absolute;font-family:"{{DISPLAY}}";font-weight:500;letter-spacing:-.015em;line-height:1.1;color:var(--ink)}
.it{font-style:italic;font-weight:400;color:var(--primary-dark)}
.acc{color:var(--accent-text)}
.t{position:absolute;font-family:"{{TEXT}}";font-weight:400;color:var(--ink);line-height:1.3}
.sub{color:var(--muted)}
.eb{position:absolute;font-family:"{{TEXT}}";font-weight:600;font-size:22px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text);white-space:nowrap}
.small{font-family:"{{TEXT}}";font-weight:500;font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);position:absolute;white-space:nowrap}
.ul{position:relative;display:inline-block}
.ul i{position:absolute;left:0;right:0;bottom:2px;height:7px;border-radius:4px;background:var(--accent);transform-origin:left center}
.w{display:inline-block}
.pill{position:absolute;padding:12px 28px 14px;border-radius:40px;font-family:"{{TEXT}}";font-weight:500;font-size:32px;white-space:nowrap}
.bub{position:absolute;padding:6px 16px 8px;border-radius:18px;background:var(--paper);border:3px solid var(--ink);font-family:"{{DISPLAY}}";font-weight:500;font-size:30px;white-space:nowrap}
.tile{position:absolute;width:90px;height:90px;border-radius:14px;background:var(--accent-light);display:flex;align-items:center;justify-content:center}
.note{position:absolute;width:150px;height:118px;border-radius:6px;box-shadow:0 8px 18px rgba(28,39,51,.12);padding:22px 18px}
.note b{display:block;height:6px;border-radius:3px;background:rgba(28,39,51,.22);margin-bottom:14px}
.mini{position:absolute;width:30px;height:24px;border-radius:4px;box-shadow:0 3px 6px rgba(28,39,51,.15)}
.chk{display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--primary)}
.p svg{width:110px;height:160px}
.ps svg{width:80px;height:116px}

#endcard{position:absolute;left:0;top:0;width:{{W}}px;height:{{H}}px;background:var(--paper)}
#ecin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:0 90px;text-align:center}
#ecin .eb{font-family:"{{TEXT}}";font-weight:600;font-size:22px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text)}
#ecin .hl{font-family:"{{DISPLAY}}";font-weight:500;font-size:72px;line-height:1.1;letter-spacing:-.015em;color:var(--ink)}
#ecin .hl em{font-style:italic;font-weight:400;color:var(--primary-dark)}
#ecin .sl{font-size:28px;color:var(--muted)}
#ecin .div{width:200px;height:3px;border-radius:2px;background:var(--accent);margin-top:28px}
#ecin .ct{font-size:32px;color:var(--ink)}
#ecin .ch{font-family:"{{DISPLAY}}";font-style:italic;font-weight:400;font-size:64px;color:var(--primary-dark);line-height:1.1}
#ecin img{display:block}
{{GEOCSS}}
{{SCENES_CSS}}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="{{W}}" data-height="{{H}}">

  <svg width="0" height="0" style="position:absolute">
    <filter id="boilF" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence id="boilT" type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="1" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <div id="panelbg" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="0">
    <div class="ring" data-layout-allow-overflow style="right:-320px;top:-300px;width:700px;height:700px;opacity:.6"></div>
    <div class="ring" data-layout-allow-overflow style="left:-260px;bottom:-260px;width:560px;height:560px;opacity:.5"></div>
    <div id="grain"></div>
  </div>

  <div id="vwrap">
    <video id="clipvideo" src="assets/video/clip.mp4" playsinline data-has-audio="true" data-start="0" data-duration="{{CLIPDUR}}" data-track-index="1"></video>
  </div>
{{LOWER_THIRD}}
  <div id="capstrip" class="clip" data-start="0" data-duration="{{CLIPDUR}}" data-track-index="2"></div>
{{FOOTER}}
  <!-- ===== scenes (src/scenes.html) ===== -->
{{SCENES_HTML}}
  <!-- ===== end card ===== -->
{{ENDCARD}}

<script>
{{FIGURES_JS}}
</script>
<script>
(function () {
  const CAPS = {{CAPS}};
  const CLIP_DUR = {{CLIPDUR}};
  const PANEL_W = {{PANEL_W}}, PANEL_H = {{PANEL_H}};
  const tl = gsap.timeline({ paused: true });
{{HELPERS_JS}}

  // captions
  const strip = document.getElementById("capstrip");
  if (strip) CAPS.forEach(([s, e, html], i) => {
    const d = document.createElement("div");
    d.className = "cap"; d.id = "cap" + i; d.innerHTML = "<span>" + html + "</span>"; // span: flex would eat the spaces around <b>
    strip.appendChild(d);
    tl.set(d, { opacity: 1 }, Q(s));
    tl.set(d, { opacity: 0 }, Q(Math.min(e, CLIP_DUR - 0.04)));
  });
  if (document.getElementById("lt")) { fin("#lt", {{LT_IN}}, 0.6, 14); fout("#lt", {{LT_OUT}}, 0.4); }

  // ===== scenes (src/scenes.js) =====
{{SCENES_JS}}

  // end card
  if (document.getElementById("ecin")) {
    tl.fromTo("#ecin", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power1.out" }, Q({{EC_START}} + 0.05));
    document.querySelectorAll("#ecin > *").forEach((el, i) => fin(el, {{EC_START}} + 0.4 + i * 0.3, 0.7, 16));
  }
  tl.set("#root", { opacity: 1 }, {{DUR}});
  window.__timelines["main"] = tl;
})();
</script>
</div>
</body>
</html>
